name: Terraform Infra Deploy

on:
  push:
    branches: ["main"]
    paths:
      - live/**
      - modules/**
      - .github/workflows/deploy.yml
      - .github/workflows/deploy.yaml
      - .github/scripts/**
      - scripts/deploy.sh
  pull_request:
    branches: ["main"]
    paths:
      - live/**
      - modules/**
      - .github/workflows/deploy.yml
      - .github/workflows/deploy.yaml
      - .github/scripts/**
      - scripts/deploy.sh
  workflow_dispatch:
    inputs:
      layer:
        description: "Layer to deploy (e.g. _global, production/networking). Leave empty to auto-detect all."
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  # JSON array of layer paths (relative to live/) that must be excluded from deploy matrix.
  # Example: ["production/litellm/bootstrap"]
  DEPLOY_EXCLUDE_LAYERS: '["production/litellm/bootstrap"]'

concurrency:
  group: terraform-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed layers
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.detect.outputs.layers }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      head_sha: ${{ steps.detect.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed layers
        id: detect
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          bash .github/scripts/detect-layers.sh \
            "${{ github.event_name }}" \
            "${BASE_SHA}" \
            "${{ github.sha }}" \
            '${{ env.DEPLOY_EXCLUDE_LAYERS }}' \
            "${{ inputs.layer }}"

  prebuild:
    name: "[${{ matrix.layer }}] Prebuild"
    needs: changes
    if: ${{ needs.changes.outputs.layers != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.changes.outputs.layers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prebuild check
        shell: bash
        run: |
          LAYER_DIR="$(bash scripts/deploy.sh resolve-dir '${{ matrix.layer }}')"
          bash .github/scripts/prebuild-check.sh \
            "$LAYER_DIR" \
            "${{ needs.changes.outputs.base_sha }}" \
            "${{ needs.changes.outputs.head_sha }}"

  deploy:
    name: "[${{ matrix.layer }}] Terraform"
    needs: [changes, prebuild]
    if: ${{ needs.changes.outputs.layers != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.changes.outputs.layers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute deploy gate
        id: gate
        shell: bash
        run: |
          LAYER_DIR="$(bash scripts/deploy.sh resolve-dir '${{ matrix.layer }}')"
          bash .github/scripts/prebuild-check.sh \
            "$LAYER_DIR" \
            "${{ needs.changes.outputs.base_sha }}" \
            "${{ needs.changes.outputs.head_sha }}" > prebuild_output.txt

          TF_CHANGED=$(grep '^TF_CHANGED=' prebuild_output.txt | cut -d'=' -f2 | xargs)
          FORCE_DEPLOY=$(grep '^FORCE_DEPLOY=' prebuild_output.txt | cut -d'=' -f2 | xargs)
          ARCH=$(grep '^ARCH=' prebuild_output.txt | cut -d'=' -f2 | xargs)

          if [[ "${TF_CHANGED:-0}" == "1" || "${FORCE_DEPLOY:-0}" == "1" ]]; then
            echo "should_deploy=1" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=0" >> "$GITHUB_OUTPUT"
          fi
          echo "arch=${ARCH:-x86}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        if: ${{ steps.gate.outputs.should_deploy == '1' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        if: ${{ steps.gate.outputs.should_deploy == '1' }}
        uses: hashicorp/setup-terraform@v3

      - name: Build (terraform plan)
        if: ${{ steps.gate.outputs.should_deploy == '1' }}
        env:
          TF_VAR_architecture: ${{ steps.gate.outputs.arch }}
          TF_VAR_manage_github_actions_role_policy: ${{ matrix.layer == '_global' && 'true' || 'false' }}
        run: bash scripts/deploy.sh terraform-plan "${{ matrix.layer }}"

      - name: Deploy (terraform apply)
        if: ${{ steps.gate.outputs.should_deploy == '1' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        env:
          TF_VAR_architecture: ${{ steps.gate.outputs.arch }}
          TF_VAR_manage_github_actions_role_policy: ${{ matrix.layer == '_global' && 'true' || 'false' }}
        run: bash scripts/deploy.sh terraform-apply "${{ matrix.layer }}"

  postbuild:
    name: "[${{ matrix.layer }}] Postbuild"
    # needs: [changes, deploy]
    # if: ${{ always() && needs.changes.outputs.layers != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.changes.outputs.layers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Postbuild check
        shell: bash
        run: |
          LAYER_DIR="$(bash scripts/deploy.sh resolve-dir '${{ matrix.layer }}')"
          bash .github/scripts/postbuild-check.sh "$LAYER_DIR"
