name: Terraform Infra Deploy

on:
  push:
    branches: ["main"]
    paths:
      - live/**
      - modules/**
      - .github/workflows/deploy.yml
      - .github/scripts/**
      - scripts/deploy.sh
  pull_request:
    branches: ["main"]
    paths:
      - live/**
      - modules/**
      - .github/workflows/deploy.yml
      - .github/scripts/**
      - scripts/deploy.sh
  workflow_dispatch:
    inputs:
      layer:
        description: "Optional layer override (e.g. production/networking)"
        required: false
        default: ""
      force_docker_build:
        description: "Force Docker image build (true/false)"
        required: false
        default: "false"
      docker_folder:
        description: "Folder to build Docker image from (e.g. live/production/litellm)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  DEPLOY_EXCLUDE_LAYERS: '["production/litellm/bootstrap"]'
  TF_IN_AUTOMATION: "1"
  LITELLM_VERSION: litellm_stable_release_branch-v1.73.0-stable
  MIDDLEWARE_VERSION: latest
  CPU_ARCHITECTURE: linux/amd64
  TF_VAR_architecture: x86
  ECR_LITELLM_REPOSITORY: litellm
  ECR_MIDDLEWARE_REPOSITORY: middleware

concurrency:
  group: terraform-infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      folders: ${{ steps.detect.outputs.folders }}
      layers: ${{ steps.detect.outputs.layers }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      head_sha: ${{ steps.detect.outputs.head_sha }}
      cpu_architecture: ${{ steps.detect.outputs.cpu_architecture }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Detection Script
        id: detect
        shell: bash
        run: |
          # We pass everything to the external script to keep YAML clean
          bash .github/scripts/detect-layers.sh \
            "${{ github.event_name }}" \
            "${{ github.event.before }}" \
            "${{ github.sha }}" \
            '${{ env.DEPLOY_EXCLUDE_LAYERS }}' \
            "${{ inputs.layer }}" \
            "${{ inputs.force_docker_build }}" \
            "${{ inputs.docker_folder }}"

          # Map the CPU architecture for downstream jobs
          echo "cpu_architecture=${{ env.TF_VAR_architecture }}" >> "$GITHUB_OUTPUT"

  docker:
    name: Build [${{ matrix.folder }}]
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.folders != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: ${{ fromJSON(needs.changes.outputs.folders) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        run: bash .github/scripts/build-image.sh "${{ matrix.matrix.folder }}"

  terraform:
    name: TF [${{ matrix.layer }}]
    needs: [changes, docker]
    # Ensure TF runs even if Docker was skipped (because no code changed there)
    if: |
      always() && 
      needs.changes.outputs.layers != '[]' && 
      (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        layer: ${{ fromJSON(needs.changes.outputs.layers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: bash scripts/deploy.sh terraform-init "${{ matrix.layer }}"

      - name: Terraform Plan
        env:
          TF_VAR_architecture: ${{ needs.changes.outputs.cpu_architecture }}
          TF_VAR_litellm_version: ${{ env.LITELLM_VERSION }}
          TF_VAR_middleware_version: ${{ env.MIDDLEWARE_VERSION }}
        run: bash scripts/deploy.sh terraform-plan "${{ matrix.layer }}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          TF_VAR_architecture: ${{ needs.changes.outputs.cpu_architecture }}
          TF_VAR_litellm_version: ${{ env.LITELLM_VERSION }}
          TF_VAR_middleware_version: ${{ env.MIDDLEWARE_VERSION }}
        run: bash scripts/deploy.sh terraform-apply "${{ matrix.layer }}"
