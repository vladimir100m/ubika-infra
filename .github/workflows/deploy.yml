name: Deploy CDK Stacks

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  # Moving stacks to a single variable for easier maintenance
  STACKS: "UbikaNetworkStack UbikaGatewayNetworkSecurityStack"

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production  # This creates the manual approval gate
    timeout-minutes: 20      # Increased slightly as CDK bootstrap + deploy can be slow
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: CDK Bootstrap & Deploy
        run: |
          npx cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}
          npx cdk deploy ${{ env.STACKS }} --require-approval never