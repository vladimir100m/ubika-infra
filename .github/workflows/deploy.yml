name: Terraform Infra Deploy

on:
  push:
    branches: ["main"]
    paths:
      - live/**
      - modules/**
      - .github/workflows/deploy.yml
      - scripts/deploy.sh
  pull_request:
    branches: ["main"]
    paths:
      - live/**
      - modules/**
      - .github/workflows/deploy.yml
      - scripts/deploy.sh
  workflow_dispatch:
    inputs:
      layer:
        description: "Layer to deploy (e.g. _global, production/networking). Leave empty to auto-detect all."
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

concurrency:
  group: terraform-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed layers
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.detect.outputs.layers }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      head_sha: ${{ steps.detect.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed layers
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # Manual dispatch with an explicit layer overrides auto-detection.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.layer }}" ]]; then
            echo "layers=[\"${{ inputs.layer }}\"]" >> "$GITHUB_OUTPUT"
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          layers_json="$(bash scripts/deploy.sh detect-layers "${BASE_SHA}" "${HEAD_SHA}")"
          echo "layers=${layers_json}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: "[${{ matrix.layer }}] Terraform"
    needs: changes
    if: ${{ needs.changes.outputs.layers != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.changes.outputs.layers) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prebuild & Terraform Check
        id: prebuild
        shell: bash
        run: |
          bash .github/scripts/prebuild-check.sh \
            "$(bash scripts/deploy.sh resolve-dir '${{ matrix.layer }}')" \
            "${{ needs.changes.outputs.base_sha }}" \
            "${{ needs.changes.outputs.head_sha }}" > prebuild_output.txt
          cat prebuild_output.txt
          TF_CHANGED=$(grep TF_CHANGED prebuild_output.txt | cut -d'=' -f2)
          echo "tf_changed=$TF_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Plan
        if: steps.prebuild.outputs.tf_changed == '1'
        run: bash scripts/deploy.sh terraform-plan "${{ matrix.layer }}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.prebuild.outputs.tf_changed == '1'
        run: bash scripts/deploy.sh terraform-apply "${{ matrix.layer }}"
