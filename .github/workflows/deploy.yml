name: Terraform Infra Deploy

on:
  push:
    branches: ["main"]
    paths:
      - live/**
      - modules/**
      - .github/workflows/deploy.yml
      - .github/scripts/**
      - scripts/deploy.sh
  pull_request:
    branches: ["main"]
    paths:
      - live/**
      - modules/**
      - .github/workflows/deploy.yml
      - .github/scripts/**
      - scripts/deploy.sh
  workflow_dispatch:
    inputs:
      layer:
        description: "Optional layer override (e.g. production/networking)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  DEPLOY_EXCLUDE_LAYERS: '["production/litellm/bootstrap"]'
  TF_IN_AUTOMATION: "1"

concurrency:
  group: terraform-infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      folders: ${{ steps.detect.outputs.folders }}
      layers: ${{ steps.detect.outputs.layers }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      head_sha: ${{ steps.detect.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect and Order Layers
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA=$(git rev-list --max-parents=0 HEAD | tail -n1)
            fi
          fi
          HEAD_SHA="${{ github.sha }}"

          # Identification logic
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.layer }}" ]]; then
            LAYERS="${{ inputs.layer }}"
            LAYERS="${LAYERS#live/}"
          else
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            if grep -q '^modules/' <<< "$CHANGED_FILES"; then
              LAYERS=$(find live -type f -name main.tf | sed 's|/main.tf$||' | sed 's|^live/||')
            else
              LAYERS=$(echo "$CHANGED_FILES" | grep '^live/' || true)
              if [[ -n "$LAYERS" ]]; then
                LAYERS=$(echo "$LAYERS" | while read -r file; do
                  dir="$file"
                  while [[ "$dir" != "." ]]; do
                    dir=$(dirname "$dir")
                    [[ -f "$dir/main.tf" ]] && echo "${dir#live/}" && break
                  done
                done | sort -u)
              fi
            fi
          fi

          # Handle empty LAYERS properly
          if [[ -z "$LAYERS" ]]; then
            ORDERED=""
          else
            # Ordering: 10=Network, 20=IAM, 30=Data, 50=Infra/LiteLLM, 60=Agents
            ORDERED=$(printf '%s\n' "$LAYERS" | awk '
              /networking/ { print "10_" $0 }
              /iam/        { print "20_" $0 }
              /rds|redis/  { print "30_" $0 }
              /litellm/    { print "50_" $0 }
              /agents/     { print "60_" $0 }
              !/networking|iam|rds|redis|litellm|agents/ { print "90_" $0 }
            ' | sort | cut -d'_' -f2-)
          fi

          L_JSON=$(printf '%s\n' "$ORDERED" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          FINAL_L=$(jq -c --argjson ex '${{ env.DEPLOY_EXCLUDE_LAYERS }}' 'map(select((. as $l | ($ex | index($l))) | not))' <<< "$L_JSON")

          # Folders for Docker build
          if [[ -z "$ORDERED" ]]; then
            F_JSON="[]"
          else
            F_JSON=$(printf '%s\n' "$ORDERED" | awk -F'/' '{print "live/"$1"/"$2}' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          echo "has_changes=$([[ "$FINAL_L" != "[]" ]] && echo "1" || echo "0")" >> "$GITHUB_OUTPUT"
          echo "layers=$FINAL_L" >> "$GITHUB_OUTPUT"
          echo "folders=$F_JSON" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  docker:
    name: Build Docker
    needs: changes
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.has_changes == '1' && needs.changes.outputs.folders != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: ${{ fromJSON(needs.changes.outputs.folders) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        shell: bash
        run: |
          if [[ -f "${{ matrix.folder }}/.postbuild.sh" || -f "${{ matrix.folder }}/Dockerfile" ]]; then
            echo "Container build context found in ${{ matrix.folder }}, building..."
            bash .github/scripts/postbuild-check.sh "${{ matrix.folder }}"
          else
            echo "No Docker build script or Dockerfile in ${{ matrix.folder }}, skipping."
          fi

  terraform:
    name: TF [${{ matrix.layer }}]
    needs:
      - changes
      - docker
    if: ${{ needs.changes.outputs.layers != '[]' && (github.event_name == 'pull_request' || needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        layer: ${{ fromJSON(needs.changes.outputs.layers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: bash scripts/deploy.sh terraform-init "${{ matrix.layer }}"

      - name: Terraform Plan
        run: bash scripts/deploy.sh terraform-plan "${{ matrix.layer }}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: bash scripts/deploy.sh terraform-apply "${{ matrix.layer }}"
