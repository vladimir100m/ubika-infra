name: Deploy CDK Stacks

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write  # REQUIRED for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  STACKS: "UbikaNetworkStack UbikaGatewayNetworkSecurityStack"

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-20.04
    environment: production  # Triggers manual approval & gives access to env secrets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # No access keys needed here!
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: uv sync

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: CDK Bootstrap & Deploy
        run: |
          npx cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}
          npx cdk deploy ${{ env.STACKS }} --require-approval never