name: Deploy CDK Stacks

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  STACKS: "UbikaNetworkStack UbikaGatewayNetworkSecurityStack"

jobs:
  approve:
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - name: Approve deployment
        run: echo "✅ Deployment approved for production"

  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: approve
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv package manager
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install project dependencies
        run: uv sync

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Bootstrap CDK environment
        run: cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}

      - name: Deploy infrastructure stacks
        run: cdk deploy ${{ env.STACKS }} --require-approval never
