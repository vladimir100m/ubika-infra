name: Terraform Infra Deploy

on:
  push:
    branches: ["main"]
    paths:
      - live/**
      - modules/**
      - .github/workflows/deploy.yml
      - .github/scripts/**
      - scripts/deploy.sh
  pull_request:
    branches: ["main"]
    paths:
      - live/**
      - modules/**
      - .github/workflows/deploy.yml
      - .github/scripts/**
      - scripts/deploy.sh
  workflow_dispatch:
    inputs:
      layer:
        description: "Optional Terraform layer override (e.g. production/networking)."
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  DEPLOY_EXCLUDE_LAYERS: '["production/litellm/bootstrap"]'

concurrency:
  group: terraform-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed folders and layers
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      folders: ${{ steps.detect.outputs.folders }}
      layers: ${{ steps.detect.outputs.layers }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      head_sha: ${{ steps.detect.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect and Order Layers
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # Helper to find all valid layers
          all_layers() {
            find live -type f -name main.tf -print | sed 's|/main.tf$||' | sed 's|^live/||' | sort -u
          }

          # Logic to determine commit range
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            # Fallback for first push or deleted history
            if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA=$(git rev-list --max-parents=0 HEAD | tail -n1)
            fi
          fi
          HEAD_SHA="${{ github.sha }}"

          # Identify Changed Layers
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.layer }}" ]]; then
            LAYERS="${{ inputs.layer }}"
            LAYERS="${LAYERS#live/}"
          else
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            if grep -q '^modules/' <<< "$CHANGED_FILES"; then
              LAYERS="$(all_layers)"
            else
              # Find unique directories containing main.tf relative to changed files
              LAYERS=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep '^live/' | while read -r file; do
                dir="$file"
                while [[ "$dir" != "." && "$dir" != "/" ]]; do
                  dir=$(dirname "$dir")
                  if [[ -f "$dir/main.tf" ]]; then
                    echo "${dir#live/}"
                    break
                  fi
                done
              done | sort -u)
            fi
          fi

          # --- CRITICAL: ORDERING LOGIC ---
          # We prefix layers with numbers to force the sort order: Networking -> IAM -> RDS/Redis -> Infra
          ORDERED_LAYERS=$(printf '%s\n' "$LAYERS" | awk '
            /networking/ { print "10_" $0 }
            /iam/        { print "20_" $0 }
            /rds|postgres|redis|elasticache/ { print "30_" $0 }
            /litellm\/infra/ { print "50_" $0 }
            /agents/     { print "60_" $0 }
            !/networking|iam|rds|postgres|redis|elasticache|litellm|agents/ { print "90_" $0 }
          ' | sort | cut -d'_' -f2-)

          # Filter out exclusions and convert to JSON
          LAYERS_JSON=$(printf '%s\n' "$ORDERED_LAYERS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          FINAL_LAYERS=$(jq -c --argjson exclude '${{ env.DEPLOY_EXCLUDE_LAYERS }}' 'map(select((. as $layer | ($exclude | index($layer))) | not))' <<< "$LAYERS_JSON")

          # Output folders for Docker job (simplified to top-level dirs)
          FOLDERS_JSON=$(printf '%s\n' "$ORDERED_LAYERS" | awk -F'/' '{print "live/"$1"/"$2}' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "has_changes=$([[ "$FINAL_LAYERS" != "[]" ]] && echo "1" || echo "0")" >> "$GITHUB_OUTPUT"
          echo "layers=$FINAL_LAYERS" >> "$GITHUB_OUTPUT"
          echo "folders=$FOLDERS_JSON" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  terraform:
    name: "[${{ matrix.layer }}] Terraform"
    needs: changes
    if: ${{ needs.changes.outputs.layers != '[]' }}
