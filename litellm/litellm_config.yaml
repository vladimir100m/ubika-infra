# LiteLLM Proxy Configuration
# This config will be mounted into the container at /app/config.yaml


general_settings:
  # Database URL - constructed from environment variables set by ECS
  # Format: postgresql://username:password@host:port/database
  database_url: os.environ/DATABASE_URL

# Optional: LiteLLM SDK settings
litellm_settings:
  # Enable detailed logs for debugging
  set_verbose: true
  
  # SSL verification (set to false if having SSL issues)
  # ssl_verify: true
  
  # Request timeout
  request_timeout: 600
  
  # Max retries
  num_retries: 3
