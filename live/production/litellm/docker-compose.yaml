version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    # Host port (left side): use a free port on your machine; 15432 avoids clashes with 5432/5433.
    ports:
      - "15432:5432"
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm -h localhost -p 5432"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  litellm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LITELLM_VERSION: latest-stable
    image: litellm-local:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      LITELLM_PORT: "4000"
      DATABASE_URL: "postgresql://litellm:litellm@db:5432/litellm"
    restart: unless-stopped

volumes:
  litellm-db-data: